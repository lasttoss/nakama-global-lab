# Add ONE cell (its own Nakama + Valkey) to a running data plane — no edits to the main compose.
# Each call = one new cell, with its own project name so several cells run side by side:
#   CELL_ID=e API_PORT=20750 CONSOLE_PORT=20751 VK_PORT=20780 \
#     docker compose -p nkglobal-cell-e -f docker-compose.cell.yml up -d
# or: bash scripts/add-cell.sh e
#
# A cell is stateless: it needs (a) the shared data plane (yb), (b) its own Valkey for local state.
name: nkglobal-cell

services:
  nakama:
    image: heroiclabs/nakama:3.41.0
    container_name: nkglobal-cell-${CELL_ID:?set CELL_ID}-nakama
    restart: unless-stopped
    entrypoint: ["/nakama/nakama"]
    command:
      - "--name=cell-${CELL_ID}"
      - "--database.address=yugabyte@yb:5433/yugabyte"
      - "--logger.level=INFO"
      - "--session.token_expiry_sec=7200"
    ports:
      - "${API_PORT:?set API_PORT}:7350"
      - "${CONSOLE_PORT:?set CONSOLE_PORT}:7351"

  valkey:
    image: valkey/valkey:8-alpine
    container_name: nkglobal-cell-${CELL_ID}-valkey
    command: ["valkey-server","--save",""]
    ports:
      - "${VK_PORT:?set VK_PORT}:6379"

# important: the cell must join the network of the running data plane
networks:
  default:
    name: nkglobal_default
    external: true
