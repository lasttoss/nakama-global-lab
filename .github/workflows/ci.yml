name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck scripts
        run: shellcheck --severity=warning scripts/*.sh

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate compose files
        run: |
          docker compose config -q
          docker compose -f docker-compose.crdb.yml config -q
          CELL_ID=x API_PORT=1 CONSOLE_PORT=2 VK_PORT=3 \
            docker compose -f docker-compose.cell.yml config -q

  migrations-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: verify pinned migration checksums
        run: bash scripts/check-sql-manifest.sh

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: scan tracked files
        run: bash scripts/check-secrets.sh

  docs-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: verify relative links
        run: python3 scripts/check-docs-links.py

  # Full lab: heavy (pulls a ~3.5 GB image and boots YugabyteDB) ⇒ manual only.
  lab-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: bring up the stack
        run: |
          make fix-perm
          make up
      - name: smoke
        run: make smoke
      - name: init is idempotent
        run: make init | tail -3
      - name: logs on failure
        if: failure()
        run: docker compose logs --tail=120
