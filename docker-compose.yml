# Nakama Global Lab — 2 cell compute (Nakama) + 1 data plane (YugabyteDB) + Valkey per-cell
# Questions this lab answers:
#  1. Does Nakama run on YugabyteDB? (migrate + auth + storage + leaderboard)
#  2. Are accounts, storage and leaderboards SHARED between two cells? (write on A, read on B)
#  3. Per-cell Valkey: local state stays unshared (the right boundary), plus the ZINCRBY double-count trap
#
# ⚠️ DIFFERS FROM UPSTREAM: no `nakama migrate up` against YB. There it dies at migration #1,
#   20250926112031-console-fine-grained-acl.sql (SQLSTATE 42703 column "role" does not exist),
#   while the SAME SQL applies cleanly through ysqlsh (20/20). See docs/yugabyte-workaround.md.
name: nkglobal

services:
  # ── DATA PLANE ─────────────────────────────────────────────────────────────
  yb:
    image: yugabytedb/yugabyte:${YB_TAG:-2026.1.2.0-b137}
    restart: unless-stopped
    container_name: nkglobal-yb
    command: ["bash","-c","bin/yugabyted start --daemon=false --base_dir=/home/yugabyte/yb_data --listen=0.0.0.0 --tserver_flags=pgsql_proxy_bind_address=0.0.0.0:5433,ysql_default_transaction_isolation=serializable"]
    environment:
      - YSQL_USER=yugabyte
    ports:
      - "20433:5433"  # YSQL (host 5433 belongs to another project -> use 20433)
    volumes:
      - yb_data:/home/yugabyte/yb_data
    healthcheck:
      test: ["CMD-SHELL","bin/ysqlsh -h $$(hostname -i) -U yugabyte -c 'select 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 8s
      retries: 40
      start_period: 90s

  # ── INITIALISING THE DATA PLANE (instead of `nakama migrate up`) ───────────
  # Applies the Nakama schema to YB via ysqlsh and records migration_info. Idempotent.
  # Nakama starts only AFTER this service completes (service_completed_successfully).
  yb-init:
    image: yugabytedb/yugabyte:${YB_TAG:-2026.1.2.0-b137}
    container_name: nkglobal-yb-init
    restart: "no"
    depends_on:
      yb:
        condition: service_healthy
    environment:
      YB_HOST: yb
      YB_PORT: "5433"
      YB_USER: yugabyte
      YB_DB: yugabyte
      MIG_DIR: /migrations
    volumes:
      - ./yb-migrations:/migrations:ro
      - ./scripts/yb-init.sh:/yb-init.sh:ro
    entrypoint: ["/bin/bash","-lc","/yb-init.sh"]

  # ── CELL A ─────────────────────────────────────────────────────────────────
  nakama-a:
    image: heroiclabs/nakama:3.41.0
    restart: unless-stopped
    container_name: nkglobal-nakama-a
    depends_on:
      yb-init:
        condition: service_completed_successfully
    entrypoint: ["/nakama/nakama"]
    command:
      - "--name=nakama-a"
      - "--database.address=yugabyte@yb:5433/yugabyte"
      - "--logger.level=INFO"
      - "--session.token_expiry_sec=7200"
      - "--console.username=admin"
      - "--console.password=password"
    ports:
      - "20350:7350"   # HTTP API cell A
      - "20351:7351"   # console cell A

  # ── CELL B (same data plane, no init and no migrate at all) ────────────────
  nakama-b:
    image: heroiclabs/nakama:3.41.0
    restart: unless-stopped
    container_name: nkglobal-nakama-b
    depends_on:
      yb-init:
        condition: service_completed_successfully
    entrypoint: ["/nakama/nakama"]
    command:
      - "--name=nakama-b"
      - "--database.address=yugabyte@yb:5433/yugabyte"
      - "--logger.level=INFO"
      - "--session.token_expiry_sec=7200"
    ports:
      - "20450:7350"   # HTTP API cell B
      - "20451:7351"   # console cell B

  # ── PER-CELL LOCAL STATE (not shared — the intended boundary) ──────────────
  valkey-a:
    image: valkey/valkey:8-alpine
    container_name: nkglobal-valkey-a
    command: ["valkey-server","--save",""]
    ports:
      - "20380:6379"

  valkey-b:
    image: valkey/valkey:8-alpine
    container_name: nkglobal-valkey-b
    command: ["valkey-server","--save",""]
    ports:
      - "20381:6379"

volumes:
  yb_data:
